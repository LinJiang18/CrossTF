epochs: 200
batch_size: 8
learning_rate: 0.0001
weight_decay: 1.0e-05
dataset: toyexample
project_name: ImagenTime_ecg
num_samples: 1000
seq_len: 250
use_stft: false
delay: 8
embedding: 32
img_resolution: 32
input_channels: 1
unet_channels: 128
ch_mult:
- 1
- 2
- 4
- 4
